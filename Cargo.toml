[workspace]
members = [
    "crates/osmo-core",
    "crates/macos-cli",
    "crates/android-bridge",
    "crates/mobile-status",
    "crates/osmo_gps_extract_gpx",
    "ios/Bridge",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
osmo-core = { path = "crates/osmo-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
