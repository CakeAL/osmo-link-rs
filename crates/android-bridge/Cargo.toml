[package]
name = "android-bridge"
version.workspace = true
edition.workspace = true

[lib]
name = "osmo_bridge"
crate-type = ["cdylib"]

[dependencies]
osmo-core.workspace = true
mobile-status = { path = "../mobile-status" }
jni = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
btleplug = "0.13.5"
