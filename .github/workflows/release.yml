name: Release mobile apps

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: '1.100.0'

jobs:
  version:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    outputs:
      android_name: ${{ steps.tag.outputs.android_name }}
      android_code: ${{ steps.tag.outputs.android_code }}
      ios_version: ${{ steps.tag.outputs.ios_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Parse release tag
        id: tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})(\.(0|[1-9][0-9]{0,2}))?$ ]]; then
            echo "::error::Expected vX.Y or vX.Y.Z without leading zeroes."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[4]:-0}"
          if (( major > 2099 )); then
            echo "::error::The Android versionCode mapping requires a major version at most 2099."
            exit 1
          fi
          {
            printf 'android_name=%s\n' "${GITHUB_REF_NAME#v}"
            printf 'android_code=%d\n' "$((major * 1000000 + minor * 1000 + patch + 1))"
            printf 'ios_version=%s.%s.%s\n' "$major" "$minor" "$patch"
          } >> "$GITHUB_OUTPUT"

      - name: Validate changelog entry
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > /dev/null

  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      ANDROID_BUILD_TOOLS: 36.0.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android and Rust build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --licenses > /dev/null)
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION"
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' "$ANDROID_HOME" "$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android
          cargo "+$RUST_VERSION" install cargo-ndk --version 4.1.2 --locked
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$RUST_VERSION" >> "$GITHUB_ENV"

      - name: Build Android release
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ needs.version.outputs.android_name }}
          APP_VERSION_CODE: ${{ needs.version.outputs.android_code }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            "-PosmoReleaseVersion=$APP_VERSION_NAME" "-PosmoReleaseVersionCode=$APP_VERSION_CODE"

      - name: Sign and verify APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing GitHub Actions secret: $secret"
              exit 1
            fi
          done
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/osmo-signing.XXXXXX")"
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          mkdir -p release
          apk="release/OsmoLink-$GITHUB_REF_NAME-android-arm64.apk"
          "$tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$signing_dir/aligned.apk"
          "$tools/apksigner" sign --ks "$signing_dir/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" "$signing_dir/aligned.apk"
          "$tools/apksigner" verify --verbose "$apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: release/OsmoLink-${{ github.ref_name }}-android-arm64.apk
          if-no-files-found: error

  ios:
    needs: version
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-apple-ios
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$RUST_VERSION" >> "$GITHUB_ENV"

      - name: Build and package unsigned IPA
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.ios_version }}
        run: |
          xcodebuild -project ios/OsmoLink.xcodeproj -scheme OsmoLink -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/osmo-ios" \
            ARCHS=arm64 MARKETING_VERSION="$APP_VERSION" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          app="$RUNNER_TEMP/osmo-ios/Build/Products/Release-iphoneos/OsmoLink.app"
          widget="$app/PlugIns/RecordingWidget.appex"
          for bundle in "$app" "$widget"; do
            test -d "$bundle"
            if codesign --display "$bundle" >/dev/null 2>&1; then
              echo "::error::Expected an unsigned bundle: $bundle"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/osmo-ipa/Payload" release
          ditto "$app" "$RUNNER_TEMP/osmo-ipa/Payload/OsmoLink.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/osmo-ipa/Payload" "release/OsmoLink-$GITHUB_REF_NAME-ios-unsigned.ipa"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: release/OsmoLink-${{ github.ref_name }}-ios-unsigned.ipa
          if-no-files-found: error

  publish:
    needs: [android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/osmo-release-notes.md"
          python3 scripts/release-notes.py "$GITHUB_REF_NAME" > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            "release/OsmoLink-$GITHUB_REF_NAME-android-arm64.apk" \
            "release/OsmoLink-$GITHUB_REF_NAME-ios-unsigned.ipa" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes"
